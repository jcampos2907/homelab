ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: technitium.famcr.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - technitium.famcr.org
      secretName: technitium-certificate-secret
serviceDns:
  type: LoadBalancer
  loadBalancerClass: tailscale
  annotations:
    tailscale.com/proxy-group: ingress-proxies
    tailscale.com/hostname: technitium-dns

serviceDoh:
  type: LoadBalancer
  loadBalancerClass: tailscale
  annotations:
    tailscale.com/proxy-group: ingress-proxies
    tailscale.com/hostname: technitium-doh

priorityClassName: dns-critical

# Admin password comes from a hand-made Secret (not in git):
#   kubectl -n technitium get secret technitium-admin -o jsonpath='{.data.password}' | base64 -d
# Technitium only reads it when it creates the admin user (fresh pod, or after
# auth.config is removed), so new cluster replicas start with the same password.
admin:
  enabled: true
  existingSecret: technitium-admin

# Technitium native clustering (v14+): pod-0 is the primary, the others are
# secondaries that sync settings, allowed/blocked lists, apps and users from it.
# Zones sync through the cluster catalog zone (famcr.org is a member).
# Each node is registered as "<ClusterIP of its per-pod Service
# technitium-technitium-dns-node-N>,<pod IP>": others reach it on the stable
# ClusterIP, and its own traffic (NOTIFY, zone transfers) comes from the pod
# IP. The chart's cluster-ip-sync sidecar (0.6.0+) re-registers the pod IP
# after every restart. The cluster was initialized/joined through the API on
# 2026-11-23; see the Technitium note in the Obsidian vault.
replicaCount: 3
clustering:
  enabled: true
  hostNetwork: false

# Only applied when a pod creates its config for the first time (new replicas),
# so they answer like pod-0 before they join the cluster and sync settings.
dnsConfig:
  recursion: Allow

# Pin pods to nodes labeled with technitium-dns=true
# Label 3 nodes: kubectl label node <name> technitium-dns=true
nodeSelector:
  technitium-dns: "true"

# Technitium 15.x. Not supported mixed with 14.x inside a cluster: the
# StatefulSet rolls all pods back to back, DNS keeps answering, config sync
# resumes once every node is on 15. Bump the chart appVersion later instead.
image:
  tag: "15.6.2"
