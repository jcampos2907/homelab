agent:
  enabled: true
  namespace: jenkins
  customJenkinsLabels:
    - "k8s-agent"
persistence:
  enabled: true

controller:
  # hostAliases:
  # - ip: "100.91.10.38"
  #   hostnames:
  #   - "keycloak.famcr.org"
  dnsConfig:
    options:
      - name: ndots
        value: "1"
  installPlugins:
    - kubernetes:4560.vc25b_83890c34
    - workflow-aggregator:608.v67378e9d3db_1
    - git:5.11.0
    - configuration-as-code:2147.v8a_8d38668c72
  additionalPlugins:
    - ssh-agent:433.v9e73d67c3f74
    - github-branch-source:1988.v87ea_66346560
    - oic-auth:4.737.vb_3d1a_0e7cf0b_  # gitleaks:allow (plugin version, not a key)
    - hashicorp-vault-plugin:384.vda_86ec66c537
    - ssh-slaves:3.1097.v868116049892  # gitleaks:allow (plugin version, not a key) - SSH build agent on nacho-3
    # Checked 2026-11-27 against core 2.580.2 / JDK 25 (chart 5.13.3) and the pins above: update center lists
    # 49.vf37bf92d2bc8 (latest) requiring core 2.222.4 and credentials 2.4.1, display-url-api 2.3.4,
    # github-api 1.123, github-branch-source 2.0.8; every minimum is below the pinned/resolved versions.
    - pipeline-githubnotify-step:49.vf37bf92d2bc8
    # org.kohsuke.github (GitHub API for Java) used by jenkins-library's ravenholdPromotionCheck comes from the github-api plugin,
    # installed as a dependency of github-branch-source above; no separate pin.
    # - kubernetes-credentials-provider:1.303.vdfcf47fb_b_fef

  jenkinsUrl: "https://jenkins.famcr.org"
  # jenkinsUrl: "http://localhost:8080"

  admin:
    password: "adminpassword123"

  ingress:
    enabled: true
    ingressClassName: traefik
    hostName: jenkins.famcr.org
    tls:
      - secretName: jenkins-certificate-secret
        hosts:
          - jenkins.famcr.org

  JCasC:
    defaultConfig: true # <- recommended
    configScripts:
      # authorization: |-
      #     jenkins:
      #       authorizationStrategy:
      #         loggedInUsersCanDoAnything:
      #           allowAnonymousRead: false

      global-libraries: |-
        unclassified:
          globalLibraries:
            libraries:
              - name: "jenkins-library"
                defaultVersion: "dev"
                allowVersionOverride: true
                implicit: false
                retriever:
                  modernSCM:
                    scm:
                      git:
                        remote: "https://github.com/jcampos2907/jenkins-library"
                        credentialsId: "github-pat"

      vault-runtime: |-
        unclassified:
          hashicorpVault:
            configuration:
              vaultCredentialId: "vault-k8s"
              vaultUrl: "${CASC_VAULT_URL}"

        credentials:
          system:
            domainCredentials:
              - credentials:
                  - vaultKubernetesCredential:
                      id: "vault-k8s"
                      description: "Vault k8s auth for runtime"
                      scope: GLOBAL
                      role: "${CASC_VAULT_KUBERNETES_ROLE}"

      github-creds: |-
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      id: "github-pat"
                      description: "GitHub PAT (used as password) for Jenkins pipelines"
                      scope: GLOBAL
                      username: "${github_user}"
                      password: "${github_pat}"

      ssh-creds-1: |-
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - basicSSHUserPrivateKey:
                      scope: GLOBAL
                      id: "ccm-ssh"
                      description: "Key to deploy in CCM Bot"
                      username: "${CCM_SSH_USER}"
                      privateKeySource:
                        directEntry:
                          privateKey: "${CCM_SSH_PRIVATE_KEY}"

      nacho3-agent: |-
        # nacho-3: Hetzner amd64 VM on the tailnet, used as the build agent for the
        # image-builder and helmcharts-pipeline jobs (they request label 'nacho-3').
        # EXCLUSIVE: only jobs that ask for its labels run there.
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - basicSSHUserPrivateKey:
                      scope: SYSTEM
                      id: "nacho3-ssh"
                      description: "SSH key for the jenkins user on nacho-3 (Secret jenkins-nacho3-ssh)"
                      username: "jenkins"
                      privateKeySource:
                        directEntry:
                          privateKey: "${NACHO3_SSH_KEY}"
        jenkins:
          nodes:
            - permanent:
                name: "nacho-3"
                labelString: "nacho-3 docker amd64"
                numExecutors: 1
                mode: EXCLUSIVE
                remoteFS: "/home/jenkins/agent"
                launcher:
                  ssh:
                    host: "100.65.51.70"
                    port: 2222
                    credentialsId: "nacho3-ssh"
                    javaPath: "/usr/bin/java"
                    launchTimeoutSeconds: 120
                    maxNumRetries: 10
                    retryWaitTime: 15
                    sshHostKeyVerificationStrategy:
                      manuallyProvidedKeyVerificationStrategy:
                        key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIZLBCPA508zw0FOuvfDw1iOEfv1w09smi/0kyc5zjt3"
                retentionStrategy: "always"

      security-realm: |-
        jenkins:
          securityRealm:
            oic:
              serverConfiguration:
                wellKnown:
                  # wellKnownOpenIDConfigurationUrl: "http://keycloak.keycloak.svc.cluster.local/realms/master/.well-known/openid-configuration"
                  wellKnownOpenIDConfigurationUrl: "https://keycloak.famcr.org/realms/master/.well-known/openid-configuration"
                  scopesOverride: "openid profile email"
              clientId: "jenkins"
              clientSecret: "${clientSecret}"
              userNameField: "preferred_username"
              userIdStrategy: "caseSensitive"
              groupIdStrategy: "caseSensitive"
              fullNameFieldName: "name"
              emailFieldName: "email"
              logoutFromOpenidProvider: false

  containerEnv:
    - name: NACHO3_SSH_KEY
      valueFrom:
        secretKeyRef:
          name: jenkins-nacho3-ssh
          key: privateKey
    - name: CASC_VAULT_URL
      valueFrom:
        secretKeyRef:
          name: jenkins-oidc
          key: CASC_VAULT_URL

    - name: CASC_VAULT_PATHS
      valueFrom:
        secretKeyRef:
          name: jenkins-oidc
          key: CASC_VAULT_PATHS

    - name: CASC_VAULT_ENGINE_VERSION
      valueFrom:
        secretKeyRef:
          name: jenkins-oidc
          key: CASC_VAULT_ENGINE_VERSION

    - name: CASC_VAULT_KUBERNETES_ROLE
      valueFrom:
        secretKeyRef:
          name: jenkins-oidc
          key: CASC_VAULT_KUBERNETES_ROLE
    - name: CCM_SSH_PRIVATE_KEY
      valueFrom:
        secretKeyRef:
          name: jenkins-oidc
          key: CCM_SSH_PRIVATE_KEY

    - name: CCM_SSH_USER
      valueFrom:
        secretKeyRef:
          name: jenkins-oidc
          key: CCM_SSH_USER
    - name: clientSecret
      valueFrom:
        secretKeyRef:
          name: jenkins-oidc
          key: clientSecret

    - name: github_user
      valueFrom:
        secretKeyRef:
          name: jenkins-oidc
          key: github_user
    - name: github_pat
      valueFrom:
        secretKeyRef:
          name: jenkins-oidc
          key: github_pat
