# Values for the `ravenhold` chart (https://jcampos2907.github.io/charts), Argo app `ravenhold`.
# Image tags are the app-repo commits they were built from. The Jenkins `master` pipelines of the four app repos
# rewrite the `tag:` lines below (marked `# ci:<component>`) and push, and Argo rolls the pods.
imagePullSecrets:
  - name: ravenhold-registry

registry: nacho-3.tail4f4c7b.ts.net/ravenhold

# Database `ravenhold` in the shared homelabcluster (role + Database in cloudnativepg/cluster). Direct to the -rw
# Service, not the PgBouncer pooler: EF migrations and the app's advisory locks need session semantics.
database:
  existingSecret: ravenhold-db
  host: homelabcluster-rw.homelab-pg.svc.cluster.local
  name: ravenhold

api:
  image:
    tag: "531619f" # ci:api
  existingSecret: ravenhold-api
  env:
    Auth__Authority: https://keycloak.famcr.org/realms/master
    Auth__Audience: ravenhold
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 768Mi}

frontend:
  image:
    tag: "e98f76c" # ci:frontend
  existingSecret: ravenhold-frontend
  env:
    OIDC_ISSUER: https://keycloak.famcr.org/realms/master
    OIDC_CLIENT_ID: ravenhold
    OIDC_REDIRECT_URI: https://ravenhold.famcr.org/auth/callback
    OIDC_SCOPE: openid profile email
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {memory: 512Mi}

docs:
  image:
    tag: "7fdc51f" # ci:docs
  resources:
    requests: {cpu: 5m, memory: 16Mi}
    limits: {memory: 64Mi}

analytics:
  image:
    tag: "17becbe" # ci:analytics
  existingSecret: ravenhold-analytics
  # Claude via workload identity federation (projected SA token, inline JWKS in the Anthropic Console).
  # IDs are not secrets. An ANTHROPIC_API_KEY in the analytics Secret would override this: keep it out of OpenBao.
  anthropicFederation:
    enabled: true
    ruleId: fdrl_01NZFBbFPvNEJ6AtDsk47wYf
    organizationId: 445d1aa5-d622-489c-8b27-8a0ce453f93e
    serviceAccountId: svac_01BYxccxa5XsiGwviEx3KtuJ
    workspaceId: wrkspc_01A9j5RXeG61DQXL29XsRjLu
  env:
    TZ: America/New_York
    TRADING_ENABLED: "false"
    TRADING_MODE: propose
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1536Mi}

migrations:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

rsshub:
  enabled: true
  existingSecret: ravenhold-rsshub
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {memory: 512Mi}

ingress:
  enabled: true
  className: traefik
  host: ravenhold.famcr.org
  docsHost: docs.ravenhold.famcr.org
  tls:
    - secretName: ravenhold-tls
      hosts:
        - ravenhold.famcr.org
        - docs.ravenhold.famcr.org

# IB Gateways (logins from OpenBao kv/apps/ravenhold/ib-gateway and ib-gateway-paper: TWS_USERID, TWS_PASSWORD).
# The live gateway stays READ_ONLY_API=yes (chart default): IB itself rejects any order on it.
ibGateway:
  live:
    enabled: true
  paper:
    enabled: true
