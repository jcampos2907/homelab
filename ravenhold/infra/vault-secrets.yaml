# Secrets from OpenBao kv-v2 `kv/apps/ravenhold/<name>` (policy `ravenhold`, k8s auth role `ravenhold`).
# Each key becomes an environment variable of that component (the chart uses envFrom).
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  namespace: ravenhold
  name: ravenhold-api
spec:
  vaultAuthRef: vault-auth
  rolloutRestartTargets:
    - kind: Deployment
      name: ravenhold-api
  mount: kv
  type: kv-v2
  path: apps/ravenhold/api
  refreshAfter: 60s
  destination:
    create: true
    name: ravenhold-api
    overwrite: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  namespace: ravenhold
  name: ravenhold-frontend
spec:
  vaultAuthRef: vault-auth
  rolloutRestartTargets:
    - kind: Deployment
      name: ravenhold-frontend
  mount: kv
  type: kv-v2
  path: apps/ravenhold/frontend
  refreshAfter: 60s
  destination:
    create: true
    name: ravenhold-frontend
    overwrite: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  namespace: ravenhold
  name: ravenhold-analytics
spec:
  vaultAuthRef: vault-auth
  rolloutRestartTargets:
    - kind: Deployment
      name: ravenhold-analytics
  mount: kv
  type: kv-v2
  path: apps/ravenhold/analytics
  refreshAfter: 60s
  destination:
    create: true
    name: ravenhold-analytics
    overwrite: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  namespace: ravenhold
  name: ravenhold-rsshub
spec:
  vaultAuthRef: vault-auth
  rolloutRestartTargets:
    - kind: Deployment
      name: ravenhold-rsshub
  mount: kv
  type: kv-v2
  path: apps/ravenhold/rsshub
  refreshAfter: 60s
  destination:
    create: true
    name: ravenhold-rsshub
    overwrite: true
---
# Pull secret for the tailnet registry on nacho-3 (user `cluster`, read only by convention).
# The OpenBao key is `.dockerconfigjson`, so the Secret is a ready dockerconfigjson.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  namespace: ravenhold
  name: ravenhold-registry
spec:
  vaultAuthRef: vault-auth
  mount: kv
  type: kv-v2
  path: apps/ravenhold/registry
  refreshAfter: 300s
  destination:
    create: true
    name: ravenhold-registry
    type: kubernetes.io/dockerconfigjson
    overwrite: true
