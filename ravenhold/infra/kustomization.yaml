apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything Ravenhold needs before the chart (Argo app `ravenhold`) can sync: the Secrets synced from OpenBao
# (kv apps/ravenhold/*) and the TLS certificate. The database lives in the shared homelabcluster
# (cloudnativepg/cluster: role + Database `ravenhold`). Argo app: `ravenhold-infra`.
namespace: ravenhold

resources:
  - sa.yaml
  - vault-auth.yaml
  - vault-secrets.yaml
  - certificate.yaml
