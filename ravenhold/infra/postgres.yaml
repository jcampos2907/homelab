# Ravenhold's own Postgres, separate from the shared homelab-pg cluster: the app needs pgvector, which the shared
# image (jicamposr/postgres:17.0) lacks, and a dedicated cluster keeps its analytics writes off everyone else.
# The CNPG "standard" image ships vector and pg_trgm. CNPG creates Secret ravenhold-pg-app (username, password)
# and Service ravenhold-pg-rw; the chart's `database` block reads both.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ravenhold-pg
  namespace: ravenhold
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-standard-bookworm
  storage:
    storageClass: longhorn
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  bootstrap:
    initdb:
      database: ravenhold
      owner: ravenhold
      # The app user is not superuser, so the extensions are created here (migration 20261025010443_Research
      # only runs CREATE EXTENSION IF NOT EXISTS).
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
        - CREATE EXTENSION IF NOT EXISTS pg_trgm
