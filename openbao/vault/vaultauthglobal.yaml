apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuthGlobal
metadata:
  namespace: hashicorp
  name: default
spec:
  allowedNamespaces:
    - oauth2
    - jenkins
    - cloudflare
    - argocd
    - homelab-pg
    - monitoring
    - tailscale
    - n8n
    - keycloak
    - onvo-mcp
    - redis
    - paperclip
  # vaultConnectionRef: vault-connection
  defaultAuthMethod: kubernetes
  kubernetes:
    audiences:
      - https://kubernetes.default.svc
    mount: kubernetes
    role: vault-apps
    serviceAccount: vault-sa
    # OpenBao 2.7.1+ re-validates the login JWT on every token renewal
    # (GHSA-gf3j-hm38-jhh5). With 600s JWTs, renewals failed after 10 min and
    # forced new DB creds (and Keycloak/n8n/paperclip restarts). 24h matches the
    # database roles' max_ttl, so rotation stays daily.
    tokenExpirationSeconds: 86400
