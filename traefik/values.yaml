deployment:
  replicas: 2
providers:
  kubernetesCRD:
    allowExternalNameServices: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    # Chart 42 renders --providers.kubernetesingress.ingressendpoint.publishedservice
    # from this, so the old additionalArguments copy of that flag was dropped.
    publishedService:
      enabled: true
      # namespace/name of the Traefik Service that’s exposed via Tailscale LB
      pathOverride: "traefik/traefik"
ingressClass:
  enabled: true
  isDefaultClass: true  # or true if you want
service:
  enabled: false
ports:
  # metrics:
  #   port: 9100
  #   expose:
  #     default: true           # exposes on Traefik Service
  #   exposedPort: 9100
  #   protocol: TCP
  web:
    # Chart 39+ validates values: per-port HTTP options live under `http:`.
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

# experimental.plugins.redirecterrors (github.com/packruler/redirect-errors) was
# removed 2026-11-23: the plugin catalog returns 404 "Unknown plugin" for it, which
# disables all plugins, and no Middleware referenced it.
# entryPoints:
#   web:
#     forwardedHeaders:
#       trustedIPs:
#         - "10.42.0.0/16"
#   websecure:
#     forwardedHeaders:
#       trustedIPs:
#         - "10.42.0.0/16"

api:
  dashboard: false
metrics:
