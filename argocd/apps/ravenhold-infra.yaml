apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ravenhold-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: ravenhold
  source:
    repoURL: https://github.com/jcampos2907/homelab.git
    targetRevision: main
    path: ravenhold/infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
