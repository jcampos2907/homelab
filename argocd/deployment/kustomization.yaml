apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/ha/install.yaml
  - sa.yaml
  - vault-auth.yaml
  - vault-secrets.yaml

# Stamp a single stack label onto every Argo pod so the topology spread
# constraint below has something to select on. The upstream manifests only
# carry a per-component app.kubernetes.io/name, which cannot express
# "spread the Argo control plane across nodes".
# includeSelectors: false is load-bearing - StatefulSet .spec.selector is
# immutable, so adding this to selectors would break argocd-application-controller
# and argocd-redis-ha-server on apply.
labels:
  - pairs:
      homelab.famcr.org/stack: argocd
    includeSelectors: false
    includeTemplates: true

# --- Allow Argo CD workloads onto the CriticalAddonsOnly-tainted node (fcr) ---
# fcr is reserved for essential workloads via CriticalAddonsOnly=true:NoSchedule,
# the same taint key the k3s system addons (coredns, metrics-server) tolerate.
#
# The spread constraint is the counterweight: each Argo component is its own
# single-replica Deployment, so the scheduler's default (soft, per-label-set)
# spreading has nothing to compare them against. Any freshly emptied node wins
# the least-allocated score for all of them at once, which is exactly how the
# whole Argo control plane landed on one node. ScheduleAnyway keeps this a
# preference - a pod still schedules when only one node is available.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                homelab.famcr.org/stack: argocd
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                homelab.famcr.org/stack: argocd
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: "CriticalAddonsOnly"
            operator: "Exists"
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: "CriticalAddonsOnly"
            operator: "Exists"

patchesJson6902:
  # --- argocd-cm OIDC + URL ---
  - target:
      group: ""
      version: v1
      kind: ConfigMap
      name: argocd-cm
      namespace: argocd
    patch: |-
      - op: add
        path: /data/accounts.jenkins
        value: apiKey
      - op: add
        path: /data/url
        value: https://argocd.famcr.org
      - op: replace
        path: /data/admin.enabled
        value: "true"
      - op: add
        path: /data/oidc.config
        value: |
          name: Keycloak
          issuer: https://keycloak.famcr.org/realms/master
          clientID: argocd
          enablePKCEAuthentication: true
          refreshTokenThreshold: 23h
          requestedScopes: ["openid", "profile", "email", "groups"]

  # --- RBAC policy.csv ---
  - target:
      group: ""
      version: v1
      kind: ConfigMap
      name: argocd-rbac-cm
      namespace: argocd
    patch: |-
      - op: add
        path: /data
        value: {}
      - op: add
        path: /data/policy.csv
        value: |
          p, role:admin, applications, *, */*, allow
          p, role:admin, projects, *, *, allow
          p, role:admin, clusters, *, *, allow
          p, role:admin, repositories, *, *, allow
          p, role:admin, accounts, *, *, allow
          p, role:admin, certificates, *, *, allow
          p, role:admin, gpgkeys, *, *, allow
          p, role:admin, logs, get, */*, allow
          p, role:admin, exec, create, */*, allow
          g, admin, role:admin

          # --- Jenkins: ALL apps ---
          p, role:jenkins, applications, get, */*, allow
          p, role:jenkins, applications, sync, */*, allow
          p, role:jenkins, applications, action/*, */*, allow
          g, jenkins, role:jenkins

          g, ArgoCDAdmins, role:admin

      - op: add
        path: /data/policy.default
        value: role:readonly

  - target:
      group: ""
      version: v1
      kind: Service
      name: argocd-server
      namespace: argocd
    patch: |-
      - op: add
        path: /metadata/annotations/tailscale.com~1proxy-group
        value: ingress-proxies
      - op: add
        path: /metadata/annotations/tailscale.com~1hostname
        value: argocd
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /spec/loadBalancerClass
        value: tailscale
