apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
spec:
  startOptimized: false
  instances: 2
  # 26.6+ DB migrations must not run alongside older pods: stop all, then start.
  update:
    strategy: RecreateOnImageChange
  image: quay.io/keycloak/keycloak:26.8.2  # keep equal to the operator version
  # bootstrapAdminSecret:
  #   name: keycloak-initial-admin
  db:
    vendor: postgres
    host: homelabcluster-rw.homelab-pg.svc.cluster.local
    database: keycloak
    usernameSecret:
      name: keycloak-user
      key: username
    passwordSecret:
      name: keycloak-user
      key: password
  http:
    httpEnabled: true
  proxy:
    headers: xforwarded
  hostname:
    strict: false
  resources:
    requests:
      cpu: 250m
      memory: 1700Mi
    limits:
      # 1 core so the one-off 26.x schema migrations finish within the startup probe
      cpu: "1"
      memory: 2000Mi
  additionalOptions:
    - name: health-enabled
      value: "true"
    - name: cache
      value: ispn
