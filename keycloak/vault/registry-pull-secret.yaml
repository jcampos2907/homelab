---
# Pull secret for the tailnet registry on nacho-3 (user `cluster`), used by the theme init container
# (keycloak-tron-theme). Same pattern as ravenhold/infra/vault-secrets.yaml (ravenhold-registry); the OpenBao
# key is `.dockerconfigjson`. Needs an OpenBao policy letting the `keycloak` role read kv/apps/ravenhold/registry
# (owner step: openbao/ has no such policy yet).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  namespace: keycloak
  name: keycloak-registry
spec:
  vaultAuthRef: vault-auth
  mount: kv
  type: kv-v2
  path: apps/ravenhold/registry
  refreshAfter: 300s
  destination:
    create: true
    name: keycloak-registry
    type: kubernetes.io/dockerconfigjson
    overwrite: true
