longhornUI:
  replicas: 1
persistence:
  defaultClassReplicaCount: 2
  defaultDataLocality: "best-effort"
  reclaimPolicy: Retain
  migratable: true

metrics:
  serviceMonitor:
    # Re-enable once kube-prometheus is back in the cluster. The
    # monitoring.coreos.com CRDs are currently absent, and leaving this on
    # makes every `helm upgrade` fail on "no matches for kind ServiceMonitor".
    enabled: false

defaultSettings:
  taintToleration: "postgres-db=true:NoSchedule;CriticalAddonsOnly=true:NoSchedule"

longhornManager:
  tolerations:
    - key: "postgres-db"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
longhornDriver:
  tolerations:
    - key: "postgres-db"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
csi:
  attacherTolerations:
    - key: "postgres-db"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
  provisionerTolerations:
    - key: "postgres-db"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
  resizerTolerations:
    - key: "postgres-db"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
  snapshotterTolerations:
    - key: "postgres-db"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
