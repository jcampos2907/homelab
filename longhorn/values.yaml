longhornUI:
  replicas: 1
persistence:
  defaultClassReplicaCount: 2
  defaultDataLocality: "best-effort"
  reclaimPolicy: Retain
  migratable: true

metrics:
  serviceMonitor:
    # Re-enable once kube-prometheus is back in the cluster. The
    # monitoring.coreos.com CRDs are currently absent, and leaving this on
    # makes every `helm upgrade` fail on "no matches for kind ServiceMonitor".
    enabled: false

defaultSettings:
  taintToleration: "postgres-db=true:NoSchedule;CriticalAddonsOnly=true:NoSchedule"
  # Longhorn leaves replica directories behind when a replica is rebuilt
  # elsewhere, and never reclaims them unless this is set. 87 orphans had
  # accumulated by 2026-09-13, holding 218G on homelab4 (every byte of its
  # disk, with zero live replicas) and 155G on homelab3 - enough to push
  # homelab4 under the 25% free-space floor and out of the schedulable pool
  # since August.
  orphanResourceAutoDeletion: "replica-data"

longhornManager:
  tolerations:
    - key: "postgres-db"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
longhornDriver:
  tolerations:
    - key: "postgres-db"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
csi:
  attacherTolerations:
    - key: "postgres-db"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
  provisionerTolerations:
    - key: "postgres-db"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
  resizerTolerations:
    - key: "postgres-db"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
  snapshotterTolerations:
    - key: "postgres-db"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
