apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
spec:
  replicas: 1
  strategy:
    # Recreate: RWO longhorn volume can only attach to one pod at a time.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
      app.kubernetes.io/instance: n8n
      app.kubernetes.io/type: master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/instance: n8n
        app.kubernetes.io/type: master
    spec:
      serviceAccountName: n8n
      securityContext:
        fsGroup: 1000
      containers:
        # ----------------------------------------------------------------
        # main n8n (editor, API, webhooks). In external task-runner mode it
        # offloads all Code-node execution to the sidecar over the broker.
        # ----------------------------------------------------------------
        - name: n8n
          image: n8nio/n8n:2.21.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: http
              containerPort: 5678
            - name: broker
              containerPort: 5679
          env:
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: N8N_EDITOR_BASE_URL
              value: "https://n8n.famcr.org/"
            - name: N8N_PORT
              value: "5678"
            - name: N8N_ENDPOINT_REST
              value: "rest"
            - name: N8N_WEBHOOK_TUNNEL_URL
              value: "https://n8n.famcr.org/"
            - name: WEBHOOK_URL
              value: "https://n8n.famcr.org/"
            # --- database (external CloudNativePG cluster) ---
            - name: DB_TYPE
              value: "postgresdb"
            - name: DB_POSTGRESDB_HOST
              value: "homelabcluster-rw.homelab-pg.svc.cluster.local"
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: "n8n"
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-user
                  key: username
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-user
                  key: password
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-encryption-key
                  key: encryption_key
            # --- external task runners (enables native Python Code node) ---
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_RUNNERS_MODE
              value: "external"
            - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: N8N_NATIVE_PYTHON_RUNNER
              value: "true"
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-runner-auth
                  key: token
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1500m"
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
        # ----------------------------------------------------------------
        # task-runner sidecar: launcher starts the JS + Python runners and
        # connects back to the main broker over localhost:5679. Custom image
        # bundles markitdown + openai in the python runner venv.
        # ----------------------------------------------------------------
        - name: task-runner
          image: jicamposr/n8n-runners:2.21.0
          imagePullPolicy: IfNotPresent
          env:
            - name: N8N_RUNNERS_TASK_BROKER_URI
              value: "http://127.0.0.1:5679"
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-runner-auth
                  key: token
            # NOTE: n8n-runner-auth is created imperatively (see runbook), not
            # via GitOps, so the token is never committed to the repo.
            # start the native python runner alongside the JS runner
            - name: N8N_NATIVE_PYTHON_RUNNER
              value: "true"
            # NOTE: the Python import allowlist (markitdown, openai) is baked
            # into the launcher config /etc/n8n-task-runners.json in the
            # jicamposr/n8n-runners image, NOT here — the launcher's per-runner
            # env-overrides would override any value set on the container.
            # To allow more packages: add them to that image's launcher config
            # AND `uv pip install` them, then rebuild the image.
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n
